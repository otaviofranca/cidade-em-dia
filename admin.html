<!DOCTYPE html>
<html lang="pt-BR">
<head>

  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231d252d'/%3E%3Cpath d='M16 4v24' stroke='%23f6c600' stroke-width='4' stroke-dasharray='6 4'/%3E%3C/svg%3E">

  <script src="js/config.js"></script>
